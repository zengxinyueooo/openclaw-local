<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍑 水果Agent看板 - 春日版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #fff3e0 50%, #fce4ec 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #66bb6a, #ff8a65, #f48fb1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #888;
            font-size: 1.1em;
        }
        
        .kanban-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .kanban-column {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
        }
        
        .column-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(0,0,0,0.05);
        }
        
        .column-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2em;
            font-weight: 600;
        }
        
        .column-todo .column-title { color: #ff8a65; }
        .column-doing .column-title { color: #66bb6a; }
        .column-done .column-title { color: #42a5f5; }
        
        .task-count {
            background: rgba(0,0,0,0.1);
            color: #666;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 500;
        }
        
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 200px;
        }
        
        .task-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-left: 4px solid #ddd;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .task-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }
        
        .task-card.todo { border-left-color: #ff8a65; }
        .task-card.doing { border-left-color: #66bb6a; }
        .task-card.done { border-left-color: #42a5f5; }
        
        .task-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .task-agent {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .agent-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            background: linear-gradient(135deg, #ffe0b2, #ffcc80);
        }
        
        .task-status {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-todo { background: #ffccbc; color: #d84315; }
        .status-doing { background: #c8e6c9; color: #2e7d32; }
        .status-done { background: #bbdefb; color: #1565c0; }
        
        .task-title {
            color: #333;
            font-size: 1em;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        
        .task-tags {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        
        .tag {
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 500;
        }
        
        .tag-coding { background: #e3f2fd; color: #1976d2; }
        .tag-research { background: #f3e5f5; color: #7b1fa2; }
        .tag-urgent { background: #ffebee; color: #c62828; }
        
        .task-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #999;
        }
        
        .task-time {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .progress-bar {
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        
        .progress-fill.todo { background: linear-gradient(90deg, #ff8a65, #ff7043); width: 0%; }
        .progress-fill.doing { background: linear-gradient(90deg, #66bb6a, #4caf50); }
        .progress-fill.done { background: linear-gradient(90deg, #42a5f5, #2196f3); width: 100%; }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #bbb;
        }
        
        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 10px;
            opacity: 0.5;
        }
        
        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #66bb6a, #4caf50);
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(102, 187, 106, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .refresh-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(102, 187, 106, 0.5);
        }
        
        .refresh-btn.spinning {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .last-update {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 30px;
        }
        
        @media (max-width: 1024px) {
            .kanban-board {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🍑 水果Agent看板</h1>
        <p>小桃主管实时监控小橙🍊和小葡🍇的工作进度</p>
    </div>
    
    <div class="kanban-board">
        <!-- 待办列 -->
        <div class="kanban-column column-todo">
            <div class="column-header">
                <div class="column-title">
                    <span>📝</span>
                    <span>待办</span>
                </div>
                <span class="task-count" id="count-todo">0</span>
            </div>
            <div class="task-list" id="list-todo">
                <div class="empty-state">
                    <div class="empty-state-icon">🌸</div>
                    <p>暂无待办任务</p>
                </div>
            </div>
        </div>
        
        <!-- 进行中列 -->
        <div class="kanban-column column-doing">
            <div class="column-header">
                <div class="column-title">
                    <span>🔥</span>
                    <span>进行中</span>
                </div>
                <span class="task-count" id="count-doing">0</span>
            </div>
            <div class="task-list" id="list-doing">
                <div class="empty-state">
                    <div class="empty-state-icon">🌱</div>
                    <p>暂无进行中的任务</p>
                </div>
            </div>
        </div>
        
        <!-- 已完成列 -->
        <div class="kanban-column column-done">
            <div class="column-header">
                <div class="column-title">
                    <span>✅</span>
                    <span>已完成</span>
                </div>
                <span class="task-count" id="count-done">0</span>
            </div>
            <div class="task-list" id="list-done">
                <div class="empty-state">
                    <div class="empty-state-icon">🌻</div>
                    <p>暂无已完成任务</p>
                </div>
            </div>
        </div>
    </div>
    
    <button class="refresh-btn" onclick="refreshData()" id="refreshBtn">🔄</button>
    
    <div class="last-update" id="lastUpdate">最后更新: 刚刚</div>
    
    <script>
        const API_URL = '/api/progress';
        let autoRefreshInterval;
        
        const agentIcons = {
            'main': '🍑',
            'coder': '🍊',
            'researcher': '🍇',
            'default': '🤖'
        };
        
        const agentNames = {
            'main': '小桃',
            'coder': '小橙',
            'researcher': '小葡'
        };
        
        function getStatusClass(status) {
            const map = {
                'pending': 'todo',
                'running': 'doing',
                'completed': 'done',
                'failed': 'todo'
            };
            return map[status] || 'todo';
        }
        
        function getStatusText(status) {
            const map = {
                'pending': '待办',
                'running': '进行中',
                'completed': '已完成',
                'failed': '失败'
            };
            return map[status] || status;
        }
        
        async function fetchProgress() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network error');
                return await response.json();
            } catch (error) {
                console.error('获取进度失败:', error);
                return [];
            }
        }
        
        function formatTime(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            return date.toLocaleString('zh-CN', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        
        function formatDuration(seconds) {
            if (!seconds) return '';
            if (seconds < 60) return `${seconds}秒`;
            if (seconds < 3600) return `${Math.floor(seconds / 60)}分钟`;
            return `${Math.floor(seconds / 3600)}小时`;
        }
        
        function createTaskCard(task) {
            const statusClass = getStatusClass(task.status);
            const icon = agentIcons[task.agent_id] || agentIcons.default;
            const name = agentNames[task.agent_id] || task.agent_id;
            
            return `
                <div class="task-card ${statusClass}">
                    <div class="task-header">
                        <div class="task-agent">
                            <div class="agent-avatar">${icon}</div>
                            <span>${name}</span>
                        </div>
                        <span class="task-status status-${statusClass}">${getStatusText(task.status)}</span>
                    </div>
                    <div class="task-title">${task.message || '无描述'}</div>
                    <div class="task-tags">
                        <span class="tag tag-${task.agent_id === 'coder' ? 'coding' : 'research'}">${task.agent_id === 'coder' ? '💻 编码' : '🔍 调研'}</span>
                    </div>
                    <div class="task-footer">
                        <span class="task-time">⏱️ ${formatDuration(task.elapsed_seconds)}</span>
                        <span>${formatTime(task.timestamp)}</span>
                    </div>
                    ${task.status === 'running' ? `
                    <div class="progress-bar">
                        <div class="progress-fill ${statusClass}" style="width: ${task.progress || 50}%"></div>
                    </div>
                    ` : ''}
                </div>
            `;
        }
        
        function renderTasks(tasks) {
            const columns = {
                todo: [],
                doing: [],
                done: []
            };
            
            tasks.forEach(task => {
                const status = getStatusClass(task.status);
                if (columns[status]) {
                    columns[status].push(task);
                }
            });
            
            // 渲染每列
            ['todo', 'doing', 'done'].forEach(status => {
                const listEl = document.getElementById(`list-${status}`);
                const countEl = document.getElementById(`count-${status}`);
                const taskList = columns[status];
                
                countEl.textContent = taskList.length;
                
                if (taskList.length === 0) {
                    const emptyIcons = { todo: '🌸', doing: '🌱', done: '🌻' };
                    const emptyTexts = { 
                        todo: '暂无待办任务', 
                        doing: '暂无进行中的任务', 
                        done: '暂无已完成任务' 
                    };
                    listEl.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">${emptyIcons[status]}</div>
                            <p>${emptyTexts[status]}</p>
                        </div>
                    `;
                } else {
                    listEl.innerHTML = taskList.map(createTaskCard).join('');
                }
            });
        }
        
        async function refreshData() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('spinning');
            
            try {
                const tasks = await fetchProgress();
                renderTasks(tasks);
                document.getElementById('lastUpdate').textContent = 
                    `最后更新: ${new Date().toLocaleString('zh-CN')}`;
            } catch (error) {
                console.error('刷新失败:', error);
            } finally {
                btn.classList.remove('spinning');
            }
        }
        
        function startAutoRefresh() {
            autoRefreshInterval = setInterval(refreshData, 5000);
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            refreshData();
            startAutoRefresh();
        });
        
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                clearInterval(autoRefreshInterval);
            } else {
                startAutoRefresh();
                refreshData();
            }
        });
    </script>
</body>
</html>
